```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KPL Official — Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
margin:0;

}

button,input,textarea,select{

}

.logo{

}

.logo-icon{

}

.login h1{
margin:0 0 8px;
}

.login p{
color:#999db4;
}

.google{
width:100%;
padding:15px;

background:#fff;

}

.dashboard{

}

.heading{

}

}

.heading p{

}

.logout{

}

.tabs{
display:flex;

}

.tab{
padding:11px 17px;

}

.tab.active{

}

}

}

}

}

.field input,
.field textarea,
.field select{

}

.field textarea{
min-height:110px;

}

.field input:focus,
.field textarea:focus,
.field select:focus{
border-color:#b7ff21;
}

.upload{
border:1px dashed #444760;
border-radius:14px;
padding:15px;
background:#0b0c17;
}

.upload input{
border:0;
padding:0;
}

.preview{
display:none;
width:100%;
max-height:220px;
object-fit:cover;
border-radius:12px;
margin-top:10px;
}

.actions{
display:flex;
gap:10px;
margin-top:18px;
}

.save{
flex:1;
border:0;
background:#b7ff21;
color:#080914;
font-weight:900;
padding:15px;
border-radius:12px;
cursor:pointer;
}

.save:disabled{
opacity:.6;
cursor:not-allowed;
}

.cancel{
padding:15px 20px;
border-radius:12px;
border:1px solid #34364e;
background:#17182a;
color:#fff;
cursor:pointer;
}

.tournament{
display:grid;
grid-template-columns:120px 1fr auto;
gap:15px;
align-items:center;
}

.tournament img{
width:120px;
height:85px;
object-fit:cover;
border-radius:12px;
background:#080914;
}

.tournament h3{
margin:0 0 5px;
}

.tournament p{
margin:0;
color:#9296aa;
font-size:13px;
line-height:1.6;
}

.tour-actions{
display:flex;
gap:7px;
}

.edit,
.delete{
border:0;
padding:9px 12px;
border-radius:9px;
cursor:pointer;
}

.edit{
background:#20223a;
color:#fff;
}

.delete{
background:#ff4267;
color:#fff;
}

.status{
position:fixed;
left:50%;
bottom:20px;
transform:translateX(-50%);
background:#191a2c;
border:1px solid #33364e;
padding:13px 18px;
border-radius:12px;
display:none;
z-index:99;
}

@media(max-width:650px){

.grid{
grid-template-columns:1fr;
}

.field.full{
grid-column:auto;
}

.tournament{
grid-template-columns:80px 1fr;
}

.tournament img{
width:80px;
height:70px;
}

.tour-actions{
grid-column:1/-1;
}

.heading{
align-items:flex-start;
}

}
</style>
</head>

<body>

<header class="top">

<div class="logo">

<div class="logo-icon">K</div>

<div>
<b>KPL</b>
<small>OFFICIAL</small>
</div>

</div>

<button class="logout" id="logoutBtn" style="display:none">
Logout
</button>

</header>


<div id="loginScreen" class="login">

<h1>KPL Admin</h1>

<p>
Sign in with your authorized Google account to manage tournaments.
</p>

<button class="google" id="googleLogin">
Continue with Google
</button>

</div>


<main id="dashboard" class="dashboard container">

<div class="heading">

<div>

<h1>Admin Dashboard</h1>

<p id="adminEmail"></p>

</div>

</div>


<div class="tabs">

<button class="tab active" data-tab="tournaments">
Tournaments
</button>

<button class="tab" data-tab="add">
Add Tournament
</button>

</div>


<section id="tournamentsTab">

<div class="card">

<h2>Live Tournaments</h2>

<div id="tournamentList">
Loading tournaments...
</div>

</div>

</section>


<section id="addTab" style="display:none">

<div class="card">

<h2 id="formTitle">
Add Tournament
</h2>


<form id="tournamentForm">

<input type="hidden" id="editId">


<div class="grid">


<div class="field">

<label>Sport</label>

<select id="sport" required>

<option value="football">
Football
</option>

<option value="cricket">
Cricket
</option>

</select>

</div>


<div class="field">

<label>Status</label>

<select id="status">

<option value="upcoming">
Upcoming
</option>

<option value="live">
Live
</option>

<option value="completed">
Completed
</option>

</select>

</div>


<div class="field full">

<label>
Tournament Name
</label>

<input
id="name"
placeholder="KPL Open Age Football Championship"
required
>

</div>


<div class="field">

<label>
Category / Age
</label>

<input
id="category"
placeholder="Open Age / U-17 / U-25"
>

</div>


<div class="field">

<label>
Venue
</label>

<input
id="venue"
placeholder="The Game Yard Turf"
required
>

</div>


<div class="field">

<label>
Match Date
</label>

<input
id="date"
type="date"
>

</div>


<div class="field">

<label>
Registration Deadline
</label>

<input
id="registrationDeadline"
type="date"
>

</div>


<div class="field">

<label>
Entry Fee (₹)
</label>

<input
id="entryFee"
type="number"
min="0"
>

</div>


<div class="field">

<label>
Advance (₹)
</label>

<input
id="advance"
type="number"
min="0"
>

</div>


<div class="field">

<label>
Prize Pool (₹)
</label>

<input
id="prizePool"
type="number"
min="0"
>

</div>


<div class="field">

<label>
Total Slots
</label>

<input
id="slots"
type="number"
min="1"
>

</div>


<div class="field">

<label>
Players Per Team
</label>

<input
id="players"
type="number"
min="1"
>

</div>


<div class="field">

<label>
Substitutes
</label>

<input
id="subs"
type="number"
min="0"
>

</div>


<div class="field full">

<label>
Prize Details
</label>

<textarea
id="prizes"
placeholder="Champion: ₹4500 + Trophy&#10;Runner: ₹3500 + Trophy"
></textarea>

</div>


<div class="field full">

<label>
Description
</label>

<textarea
id="description"
placeholder="Tournament details..."
></textarea>

</div>


<div class="field full">

<label>
Rules
</label>

<textarea
id="rules"

></textarea>

</div>


<div class="field">

<label>
Tournament Image
</label>

<div class="upload">

<input
id="image"

accept="image/*"
>

<img
id="imagePreview"

>

</div>

</div>

<label>
Banner Image
</label>

<div class="upload">

<input
id="banner"

accept="image/*"
>

<img
id="bannerPreview"
class="preview"
>

</div>

</div>


</div>


<div class="actions">

<button
type="button"
class="cancel"
id="cancelBtn"
>
Cancel
</button>

<button
type="submit"

>
SAVE TO PUBLIC WEBSITE
</button>

</div>

</form>

</div>

</section>

</main>


<div class="status" id="statusBox"></div>


<script type="module">


import {

auth,
db,
storage,
provider,
signInWithPopup,
onAuthStateChanged,
signOut

} from "./firebase.js";


import {

collection,
addDoc,
updateDoc,
deleteDoc,
doc,
onSnapshot,
serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {

ref,
uploadBytes,
getDownloadURL

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";



/* =========================
   KPL ADMIN EMAIL
========================= */

const ADMIN_EMAIL = "rgmoviein@gmail.com";



const loginScreen =
document.getElementById("loginScreen");

const dashboard =
document.getElementById("dashboard");

const googleLogin =
document.getElementById("googleLogin");

const logoutBtn =
document.getElementById("logoutBtn");

const adminEmail =
document.getElementById("adminEmail");

const tournamentList =
document.getElementById("tournamentList");

const tournamentForm =
document.getElementById("tournamentForm");

const editId =
document.getElementById("editId");

const formTitle =
document.getElementById("formTitle");

const saveBtn =
document.getElementById("saveBtn");

const statusBox =
document.getElementById("statusBox");



function showStatus(message){

statusBox.textContent = message;

statusBox.style.display = "block";

setTimeout(()=>{

statusBox.style.display = "none";

},3000);

}



/* =========================
   GOOGLE LOGIN
========================= */

googleLogin.addEventListener(
"click",
async()=>{

try{

googleLogin.disabled = true;

googleLogin.textContent =
"Signing in...";

await signInWithPopup(
auth,
provider
);

}catch(error){

console.error(error);

alert(
"Login failed.\n\n"+
error.message
);

googleLogin.disabled = false;

googleLogin.textContent =
"Continue with Google";

}

});



/* =========================
   AUTH CHECK
========================= */

onAuthStateChanged(
auth,
user=>{

if(!user){

loginScreen.style.display =
"block";

dashboard.style.display =
"none";

logoutBtn.style.display =
"none";

return;

}


if(
user.email.toLowerCase()
!== ADMIN_EMAIL.toLowerCase()
){

alert(
"Administrator access required."
);

signOut(auth);

return;

}


loginScreen.style.display =
"none";

dashboard.style.display =
"block";

logoutBtn.style.display =
"block";

adminEmail.textContent =
user.email;

});



logoutBtn.addEventListener(
"click",
()=>{

signOut(auth);

});



/* =========================
   TABS
========================= */

document
.querySelectorAll(".tab")
.forEach(tab=>{

tab.addEventListener(
"click",
()=>{

document
.querySelectorAll(".tab")
.forEach(x=>
x.classList.remove("active")
);

tab.classList.add("active");

const target =
tab.dataset.tab;


document.getElementById(
"tournamentsTab"
).style.display =
target === "tournaments"
? "block"
: "none";


document.getElementById(
"addTab"
).style.display =
target === "add"
? "block"
: "none";

});

});



/* =========================
   IMAGE PREVIEW
========================= */

function previewFile(
input,
preview
){

input.addEventListener(
"change",
()=>{

const file =
input.files[0];

if(!file)return;

const url =
URL.createObjectURL(file);

preview.src = url;

preview.style.display =
"block";

});

}


previewFile(
document.getElementById("image"),
document.getElementById("imagePreview")
);


previewFile(
document.getElementById("banner"),
document.getElementById("bannerPreview")
);



/* =========================
   UPLOAD IMAGE
========================= */

async function uploadImage(
file,
folder
){

if(!file)return "";

const safeName =
Date.now()+
"_"+ 
file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const storageRef =
ref(
storage,
`${folder}/${safeName}`
);

await uploadBytes(
storageRef,
file
);

return await getDownloadURL(
storageRef
);

}



/* =========================
   SAVE TO FIRESTORE
========================= */

tournamentForm.addEventListener(
"submit",
async e=>{

e.preventDefault();

try{

saveBtn.disabled = true;

saveBtn.textContent =
"SAVING...";


const id =
editId.value;


const imageFile =
document.getElementById(
"image"
).files[0];


const bannerFile =
document.getElementById(
"banner"
).files[0];


let imageUrl = "";

let bannerUrl = "";


if(imageFile){

showStatus(
"Uploading tournament image..."
);

imageUrl =
await uploadImage(
imageFile,
"tournaments/images"
);

}


if(bannerFile){

showStatus(
"Uploading banner..."
);

bannerUrl =
await uploadImage(
bannerFile,
"tournaments/banners"
);

}



const data = {

sport:
document.getElementById(
"sport"
).value,

status:
document.getElementById(
"status"
).value,

name:
document.getElementById(
"name"
).value.trim(),

category:
document.getElementById(
"category"
).value.trim(),

venue:
document.getElementById(
"venue"
).value.trim(),

date:
document.getElementById(
"date"
).value,

registrationDeadline:
document.getElementById(
"registrationDeadline"
).value,

entryFee:
Number(
document.getElementById(
"entryFee"
).value || 0
),

advance:
Number(
document.getElementById(
"advance"
).value || 0
),

prizePool:
Number(
document.getElementById(
"prizePool"
).value || 0
),

slots:
Number(
document.getElementById(
"slots"
).value || 0
),

players:
Number(
document.getElementById(
"players"
).value || 0
),

subs:
Number(
document.getElementById(
"subs"
).value || 0
),

prizes:
document.getElementById(
"prizes"
).value.trim(),

description:
document.getElementById(
"description"
).value.trim(),

rules:
document.getElementById(
"rules"
).value.trim(),

updatedAt:
serverTimestamp()

};



if(imageUrl){

data.imageUrl =
imageUrl;

}


if(bannerUrl){

data.bannerUrl =
bannerUrl;

}



if(id){

await updateDoc(
doc(
db,
"tournaments",
id
),
data
);

showStatus(
"Tournament updated successfully."
);

}else{

data.registeredCount = 0;

data.createdAt =
serverTimestamp();


await addDoc(
collection(
db,
"tournaments"
),
data
);

showStatus(
"Tournament added successfully."
);

}


resetForm();


document
.querySelector(
'[data-tab="tournaments"]'
)
.click();


}catch(error){

console.error(error);

alert(
"Save failed.\n\n"+
error.message
);

}finally{

saveBtn.disabled = false;

saveBtn.textContent =
"SAVE TO PUBLIC WEBSITE";

}

});



/* =========================
   LOAD TOURNAMENTS
========================= */

onSnapshot(
collection(db,"tournaments"),
snapshot=>{

if(snapshot.empty){

tournamentList.innerHTML =

`<p style="color:#8f92a8">
No tournaments added yet.
</p>`;

return;

}


const tournaments = [];


snapshot.forEach(item=>{

tournaments.push({

id:item.id,

...item.data()

});

});


tournaments.sort(
(a,b)=>
(a.date || "")
.localeCompare(
b.date || ""
)
);


tournamentList.innerHTML =
tournaments.map(t=>{

const image =
t.imageUrl ||
t.bannerUrl ||
"";


const sport =
String(
t.sport || ""
).toUpperCase();


return `

<div class="card tournament">

${
image
?
`<img
src="${image}"
alt=""
>`
:
`<div style="
width:100%;
height:85px;
border-radius:12px;
background:#090a15;
display:grid;
place-items:center;
color:#b7ff21;
font-weight:900;
">
KPL
</div>`
}

<div>

<h3>
${escapeHtml(
t.name || "Untitled"
)}
</h3>

<p>

${escapeHtml(sport)}
•
${escapeHtml(
t.category ||
"Tournament"
)}

<br>

${escapeHtml(
t.venue ||
"Venue not set"
)}

<br>

Entry ₹
${Number(
t.entryFee || 0
)}

•
${Number(
t.registeredCount || 0
)}
/
${Number(
t.slots || 0
)}

</p>

</div>


<div class="tour-actions">

<button
class="edit"
data-edit="${t.id}"
>
Edit
</button>

<button
class="delete"
data-delete="${t.id}"
>
Delete
</button>

</div>

</div>

`;

}).join("");


document
.querySelectorAll(
"[data-edit]"
)
.forEach(btn=>{

btn.addEventListener(
"click",
()=>{

const t =
tournaments.find(
x=>
x.id ===
btn.dataset.edit
);

if(t)
editTournament(t);

});

});


document
.querySelectorAll(
"[data-delete]"
)
.forEach(btn=>{

btn.addEventListener(
"click",
async()=>{

if(
!confirm(
"Delete this tournament permanently?"
)
)return;


try{

await deleteDoc(
doc(
db,
"tournaments",
btn.dataset.delete
)
);

showStatus(
"Tournament deleted."
);

}catch(error){

alert(
error.message
);

}

});

});

},
error=>{

console.error(error);

tournamentList.innerHTML =

`<p style="color:#ff4267">

Could not load tournaments.

<br>

${escapeHtml(
error.message
)}

</p>`;

});



/* =========================
   EDIT TOURNAMENT
========================= */

function editTournament(t){

editId.value =
t.id;


document.getElementById(
"sport"
).value =
t.sport ||
"football";


document.getElementById(
"status"
).value =
t.status ||
"upcoming";


document.getElementById(
"name"
).value =
t.name ||
"";


document.getElementById(
"category"
).value =
t.category ||
"";


document.getElementById(
"venue"
).value =
t.venue ||
"";


document.getElementById(
"date"
).value =
t.date ||
"";


document.getElementById(
"registrationDeadline"
).value =
t.registrationDeadline ||
"";


document.getElementById(
"entryFee"
).value =
t.entryFee ||
"";


document.getElementById(
"advance"
).value =
t.advance ||
"";


document.getElementById(
"prizePool"
).value =
t.prizePool ||
"";


document.getElementById(
"slots"
).value =
t.slots ||
"";


document.getElementById(
"players"
).value =
t.players ||
"";


document.getElementById(
"subs"
).value =
t.subs ||
"";


document.getElementById(
"prizes"
).value =
t.prizes ||
"";


document.getElementById(
"description"
).value =
t.description ||
"";


document.getElementById(
"rules"
).value =
t.rules ||
"";


if(t.imageUrl){

const preview =
document.getElementById(
"imagePreview"
);

preview.src =
t.imageUrl;

preview.style.display =
"block";

}


if(t.bannerUrl){

const preview =
document.getElementById(
"bannerPreview"
);

preview.src =
t.bannerUrl;

preview.style.display =
"block";

}


formTitle.textContent =
"Edit Tournament";


document
.querySelector(
'[data-tab="add"]'
)
.click();

}



/* =========================
   RESET
========================= */

function resetForm(){

tournamentForm.reset();

editId.value = "";

formTitle.textContent =
"Add Tournament";


document
.querySelectorAll(".preview")
.forEach(x=>{

x.src = "";

x.style.display =
"none";

});

}



/* =========================
   CANCEL
========================= */

document
.getElementById("cancelBtn")
.addEventListener(
"click",
resetForm
);



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

return String(value ?? "")
.replaceAll(
"&",
"&amp;"
)
.replaceAll(
"<",
"&lt;"
)
.replaceAll(
">",
"&gt;"
)
.replaceAll(
'"',
"&quot;"
)
.replaceAll(
"'",
"&#039;"
);

}

</script>

</body>
</html>
```
